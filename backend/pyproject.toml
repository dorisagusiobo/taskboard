[project]
name = "project-management-mvp"
version = "0.1.0"
description = "Backend for the project management MVP"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.10.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--cov=main",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]

[tool.ruff]
target-version = "py313"
